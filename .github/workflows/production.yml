name: production-deploy-skeleton

# V1: el deploy a produccion se realiza MANUALMENTE desde SSH siguiendo
# infra/scripts/deploy-checklist.md. Este archivo existe para:
#  1. Documentar el contrato de inputs (tag, ref).
#  2. Quedar listo para activarse cuando se configuren secrets y la rama main
#     este protegida con required reviews + CI verde.
#
# Hasta entonces, `if: false` impide cualquier ejecucion accidental.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a desplegar (formato vX.Y.Z)'
        required: true

jobs:
  deploy:
    if: false  # SAFETY: deshabilitado hasta que el owner finalice la configuracion.
    name: Deploy to production (skeleton)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag inválido: ${{ inputs.tag }}. Esperado vX.Y.Z." >&2
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (full — build needs vite/sharp devDeps)
        run: npm ci

      # - name: Deploy via SSH (cuando existan secrets)
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.PROD_HOST }}
      #     username: ${{ secrets.PROD_USER }}
      #     key: ${{ secrets.PROD_SSH_KEY }}
      #     script: |
      #       cd /var/www/vhosts/crudomov.es/httpdocs
      #       git fetch --tags
      #       git checkout ${{ inputs.tag }}
      #       npm ci                              # completo: build necesita devDeps
      #       NODE_ENV=production npm run db:migrate
      #       NODE_ENV=production npm run build   # genera dist/
      #       npm prune --omit=dev               # adelgazar runtime tras el build
      #       touch tmp/restart.txt || true

      - name: Manual deploy reminder
        run: |
          echo "PRODUCCIÓN se despliega manualmente. Sigue infra/scripts/deploy-checklist.md."
          echo "Verificación post-deploy obligatoria via infra/scripts/smoke.sh."
