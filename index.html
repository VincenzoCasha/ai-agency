<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E4" />
    <meta name="description" content="CRUDO — tienda de quesos artesanos en el centro de Madrid. Selección del mes, tablas para llevar, maridajes por WhatsApp y eventos." />
    <link rel="icon" type="image/svg+xml" href="/img/brand/logo-color.svg" />
    <link rel="canonical" href="https://crudomov.es/" />

    <!-- Open Graph por defecto (las páginas lo sobreescriben vía useSeo) -->
    <meta property="og:site_name" content="CRUDO" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="CRUDO — Tienda de quesos artesanos en Madrid" />
    <meta property="og:description" content="Quesos artesanos, tablas para llevar, maridajes por WhatsApp y eventos en pleno centro de Madrid." />
    <meta property="og:image" content="/img/brand/crudo-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- JSON-LD: ficha de negocio local (tienda de quesos, NO wine bar) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "CRUDO",
      "description": "Tienda de quesos artesanos y cheese bar en Madrid.",
      "image": "https://crudomov.es/img/brand/crudo-logo.png",
      "url": "https://crudomov.es",
      "telephone": "+34650131861",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Calle José Ortega y Gasset 81",
        "addressLocality": "Madrid",
        "postalCode": "28006",
        "addressCountry": "ES"
      },
      "priceRange": "€€",
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "17:30", "closes": "22:30" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "12:30", "closes": "22:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "12:30", "closes": "20:00" }
      ]
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>CRUDO — Tienda de quesos y cheese bar en Madrid</title>
  </head>
  <body class="bg-bg-primary text-text-primary font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
