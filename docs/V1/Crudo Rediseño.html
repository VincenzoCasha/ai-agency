<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CRUDO · Rediseño visual · Piscolabis brand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&family=Bagel+Fat+One&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#e8e2d2; }
  body { font-family: 'Barlow', system-ui, sans-serif; color:#1A1F14; }

  /* ---------- Piscolabis brand tokens (manual oficial) ---------- */
  :root {
    --c-bone:        #F6F1E4;   /* fondo principal */
    --c-bone-soft:   #EFE8D6;   /* fondo secundario */
    --c-white:       #FFFFFF;
    --c-ink:         #1A1F14;   /* texto principal */
    --c-coral:       #EE769C;   /* primario CTA */
    --c-coral-hover: #E55D88;
    --c-coral-soft:  #F6B6C8;   /* rosa suave */
    --c-vino:        #6C4050;   /* texto secundario + bordes */
    --c-vino-line:   rgba(108, 64, 80, 0.18);
    --c-vino-line-2: rgba(108, 64, 80, 0.30);
    --c-cream:       #FEDB9A;   /* amarillo crema highlights */
    --c-terra:       #A71E17;   /* eyebrows, RetroSign */
    --c-petrol:      #447A96;   /* info */

    --f-display: 'Cinzel', 'Trajan Pro', 'Times New Roman', serif;
    --f-body:    'Barlow', system-ui, -apple-system, sans-serif;
    --f-mono:    'JetBrains Mono', ui-monospace, monospace;
  }

  /* ---------- Generic helpers used across mockups ---------- */
  .mockup, .mockup * { box-sizing: border-box; }
  .mockup { font-family: var(--f-body); -webkit-font-smoothing: antialiased; }

  .display { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1.05; }
  .mono { font-family: var(--f-mono); font-feature-settings: 'tnum' 1; }

  /* Eyebrow pill — terracota tag, the brand's signature retro sign accent */
  .eyebrow-pill {
    display:inline-block;
    background: var(--c-terra);
    color: #fff;
    font-family: var(--f-body);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 6px 12px 5px;
    border-radius: 3px;
  }
  .eyebrow-line {
    font-family: var(--f-body);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--c-terra);
  }

  /* ---------- Buttons ---------- */
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family: var(--f-body); font-weight: 600; font-size: 14px; line-height: 1;
    border:0; border-radius: 4px; padding: 14px 22px; cursor:pointer;
    text-decoration: none; transition: background .15s, color .15s, border-color .15s, transform .12s;
    letter-spacing: 0.01em;
  }
  .btn--primary { background: var(--c-coral); color: #fff; }
  .btn--primary:hover { background: var(--c-coral-hover); }
  .btn--outline { background: transparent; color: var(--c-vino); border:1px solid var(--c-vino); }
  .btn--outline:hover { background: var(--c-vino); color: #fff; }
  .btn--ink { background: var(--c-ink); color: var(--c-bone); }
  .btn--ink:hover { background: #2c3225; }
  .btn--whatsapp { background: #25D366; color: #06351F; }
  .btn--whatsapp:hover { background: #2EE47A; }
  .btn--block { width: 100%; }
  .btn--lg { padding: 16px 26px; font-size: 15px; }
  .btn--sm { padding: 10px 14px; font-size: 12.5px; }

  /* ---------- Tag ---------- */
  .tag {
    display:inline-block; padding: 4px 10px; border-radius: 999px;
    font-family: var(--f-body); font-weight: 600; font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.10em;
  }
  .tag--coral-soft { background: var(--c-coral-soft); color: #5b1f37; }
  .tag--cream     { background: var(--c-cream); color: #5b3a0e; }
  .tag--petrol    { background: rgba(68,122,150,0.15); color: var(--c-petrol); }
  .tag--terra     { background: rgba(167,30,23,0.12); color: var(--c-terra); }
  .tag--vino-out  { background: transparent; color: var(--c-vino); border:1px solid var(--c-vino-line-2); }

  /* ---------- Photo placeholders ---------- */
  .photo {
    background:
      repeating-linear-gradient(135deg,
        rgba(108,64,80,0.18) 0 6px,
        rgba(108,64,80,0.05) 6px 14px),
      var(--c-bone-soft);
    color: var(--c-vino);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--f-mono);
    font-size: 10.5px; letter-spacing: 0.04em;
    text-align:center; padding: 10px; overflow:hidden;
  }
  .photo--dark {
    background:
      repeating-linear-gradient(135deg,
        rgba(255,255,255,0.10) 0 6px,
        rgba(255,255,255,0.03) 6px 14px),
      #2a201f;
    color: rgba(255,255,255,0.60);
  }

  /* Hero photo + subtle wine overlay so the cinzel headline can sit on it */
  .hero-photo {
    position: relative;
    background:
      repeating-linear-gradient(135deg,
        rgba(245,220,200,0.10) 0 6px,
        rgba(245,220,200,0.02) 6px 14px),
      linear-gradient(160deg, #3a2228 0%, #6c4050 55%, #2a1820 100%);
    overflow: hidden;
  }
  .hero-photo::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(26,32,20,0) 35%, rgba(26,32,20,0.55) 100%),
      linear-gradient(95deg, rgba(26,32,20,0.40) 0%, rgba(26,32,20,0) 55%);
    pointer-events:none;
  }
  .hero-photo > * { position: relative; z-index: 2; }
  .hero-photo .photo-stamp {
    position:absolute; right: 14px; bottom: 14px; z-index: 3;
    font-family: var(--f-mono); font-size: 10px;
    color: rgba(255,255,255,0.45); letter-spacing: 0.06em;
  }

  /* Card: white surface, vino 18% border */
  .card {
    background: #fff;
    border: 1px solid var(--c-vino-line);
    border-radius: 6px;
    transition: transform .18s, box-shadow .18s, border-color .18s;
  }
  .card:hover {
    border-color: var(--c-vino-line-2);
    box-shadow: 0 8px 28px rgba(108,64,80,0.08);
    transform: translateY(-2px);
  }

  /* Nav link */
  .nav-link {
    font-family: var(--f-body);
    font-weight: 500;
    font-size: 14px;
    color: var(--c-ink);
    text-decoration: none;
    letter-spacing: 0.01em;
    padding: 6px 2px;
    border-bottom: 1.5px solid transparent;
    transition: border-color .15s, color .15s;
  }
  .nav-link:hover, .nav-link.active { border-bottom-color: var(--c-coral); color: var(--c-ink); }

  /* ---------- Phone frame ---------- */
  .phone {
    background: #1a1a1a; border-radius: 42px; padding: 10px;
    box-shadow: 0 16px 50px rgba(108,64,80,0.18), 0 0 0 1px rgba(0,0,0,0.05);
  }
  .phone__screen {
    width: 390px; height: 844px; border-radius: 32px; overflow: hidden;
    background: var(--c-bone); position: relative;
  }
  .phone__notch {
    position:absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 28px; background: #1a1a1a; border-radius: 16px; z-index: 50;
  }
  .statusbar {
    height: 44px; padding: 0 28px;
    display:flex; align-items:center; justify-content:space-between;
    color: var(--c-ink); font-size: 13px; font-weight: 600;
    position:relative; z-index: 40;
  }
  .statusbar--light { color: #fff; }
  .scroll { height: calc(100% - 44px); overflow: hidden; position: relative; background: var(--c-bone); }

  /* ---------- Desktop frame ---------- */
  .browser { background:#1a1a1a; border-radius: 12px; padding: 8px; box-shadow: 0 16px 50px rgba(108,64,80,0.18); }
  .browser__bar { height: 22px; display:flex; align-items:center; gap:6px; padding: 4px 8px; }
  .browser__bar i { width:10px; height:10px; border-radius:50%; background:#444; display:inline-block; }
  .browser__bar i:nth-child(1){ background:#ee5d5d; }
  .browser__bar i:nth-child(2){ background:#f0bb40; }
  .browser__bar i:nth-child(3){ background:#5fcc6b; }
  .browser__addr {
    flex:1; height: 24px; background: #2c2c2c; border-radius: 6px;
    color: #aaa; font-family: var(--f-mono); font-size: 11px;
    display:flex; align-items:center; padding: 0 12px;
  }
  .browser__screen { width: 1280px; height: 800px; background: var(--c-bone); border-radius: 6px; overflow:hidden; position:relative; }

  /* ---------- Crudo wordmark (retro disco placeholder) ---------- */
  .wordmark {
    font-family: var(--f-display);
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--c-terra);
    line-height: 0.9;
    display:inline-flex; align-items:center; gap: 8px;
  }
  .wordmark::before {
    content: '';
    display:inline-block;
    width: 1.2em; height: 1.2em;
    background: var(--c-terra);
    border-radius: 50%;
    /* Placeholder: a coral disc with white initial — stands in for owner's RetroSign mark */
    box-shadow: inset 0 0 0 3px var(--c-bone), inset 0 0 0 4px var(--c-terra);
  }

  /* ---------- Crudo inline wordmark (one-line, for nav) ---------- */
  /* Recreates the brand's stacked-shadow DNA: coral front + cream + red + petrol
     offset layers behind. Uses Bagel Fat One (chunky rounded display) as a
     close proxy for the owner's custom retro letterforms. */
  .wordmark-inline {
    font-family: 'Bagel Fat One', 'Cooper Black', serif;
    font-weight: 400;
    text-transform: lowercase;
    letter-spacing: 0.005em;
    line-height: 1;
    color: var(--c-coral);
    display: inline-block;
    /* Layer stack reads from front → back: cream halo, terra red, petrol blue.
       Each layer offsets ~1/22 of the font-size diag-down so it scales
       proportionally. Use em units everywhere for clean scaling. */
    text-shadow:
       0.045em 0.045em 0 var(--c-cream),
       0.090em 0.090em 0 var(--c-terra),
       0.135em 0.135em 0 var(--c-petrol),
       0.150em 0.150em 0.5px rgba(0,0,0,0.12);
    -webkit-font-smoothing: antialiased;
    padding-right: 0.15em;        /* room for the offset shadow */
    padding-bottom: 0.15em;
  }
  .wordmark-inline--dark {        /* vino front · matches color V2 */
    color: var(--c-vino);
    text-shadow:
       0.045em 0.045em 0 var(--c-coral-soft),
       0.090em 0.090em 0 var(--c-cream),
       0.135em 0.135em 0 var(--c-petrol),
       0.150em 0.150em 0.5px rgba(0,0,0,0.10);
  }

  /* ---------- Misc utility ---------- */
  .hr-vino { border: 0; border-top: 1px solid var(--c-vino-line); margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
